
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    server {
        listen       80;
        server_name  localhost;
		
		# 1. FRONTEND REACT (Gerencia as rotas do navegador)
		location / {
			root   html;
			index  index.html index.htm;
			try_files $uri $uri/ /index.html; # <-- ESSA LINHA É OBRIGATÓRIA
		}

		# 2. PROXY DA API
		location /api/ {
			proxy_pass http://localhost:5000;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		# 3. PROXY DE AUTENTICAÇÃO
		location /auth/ {
			proxy_pass http://localhost:5000; # Ou a porta do seu serviço de auth
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
		
		# 4. PROXY PARA METADADOS / MÓDULOS
		location /meta/ {
			proxy_pass http://localhost:5000; # Altere a porta se este serviço rodar em outro lugar
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
		
		# 5. PROXIES DIRETOS PARA O BLAZOR / ELSA (PORTA 5001)
		location /elsa/ {
			proxy_pass http://localhost:6001; # Apontando direto para o Blazor
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /identity/ {
			proxy_pass http://localhost:6001; # Apontando direto para o Blazor
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /_framework/ {
			proxy_pass http://localhost:6001; 
			proxy_set_header Host $host;
		}

		location /_content/ {
			proxy_pass http://localhost:6001;
			proxy_set_header Host $host;
		}

		location /_blazor/ {
			proxy_pass http://localhost:6001;
			proxy_set_header Host $host;
			# Suporte a WebSockets necessário para o Blazor Server/Hub
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "Upgrade";
		}


		# 6. PROXY PLANEJADOR DE FLUXO (Com Rewrite e Header customizado)
		location /planejadorDeFluxo/ {
			proxy_pass http://localhost:6001/; # O '/' no final faz o rewrite automático
			proxy_set_header Host $host; 
			proxy_set_header X-Forwarded-Prefix "/planejadorDeFluxo";
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
		
    }


